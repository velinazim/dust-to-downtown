const city = await (await fetch(`../cities/${SLUG}/city.json`, { cache: 'no-store' })).json();

      m4.compose(p3.set(b.x, top, b.z), q, roof === 'hip' ? s3.set(b.w * sc * 1.02, b.rh * k, b.d * sc * 1.02) : ZERO); bHip.setMatrixAt(i, m4);
      m4.compose(p3.set(b.x, top, b.z), q, roof === 'gable' ? s3.set(b.w * sc * 1.04, b.rh * k, b.d * sc * 1.04) : ZERO); bGable.setMatrixAt(i, m4);
      m4.compose(p3.set(b.x, top, b.z), q, roof === 'flat' ? s3.set(b.w * sc * 0.9, 0.0025 * k, b.d * sc * 0.9) : ZERO); bFlat.setMatrixAt(i, m4);
      if (b.chim) { m4.compose(p3.set(b.x + b.w * 0.3, b.y, b.z), q.identity(), s3.set(0.006, (b.h + 0.03) * k, 0.006)); bChim.setMatrixAt(ci++, m4); }
    });
    for (const m of [bBody, bHip, bGable, bFlat, bChim]) m.instanceMatrix.needsUpdate = true;
    TR.forEach((tr, i) => { const k = 1 - sstep(tr.v, tr.v + 0.5, t); m4.compose(p3.set(tr.x, tr.y, tr.z), q.identity(), s3.set(tr.s * k, tr.s * 1.25 * k, tr.s * k)); tMesh.setMatrixAt(i, m4); });
    tMesh.instanceMatrix.needsUpdate = true;
    pieces.forEach((p, i) => { const k = sstep(p.a, p.a + 0.3, t) * (1 - sstep(p.f, p.f + 0.7, t)); q.setFromAxisAngle(up, p.yaw); m4.compose(p3.set(p.x, p.y, p.z), q, k > 0 ? s3.set(p.sx, p.flat ? p.sy : p.sy * k, p.flat ? p.sz * k : p.sz) : ZERO); wMesh.setMatrixAt(i, m4); });
    wMesh.instanceMatrix.needsUpdate = true;
    TENTS.forEach((tn, i) => { const k = sstep(tn.a, tn.a + 0.4, t) * (1 - sstep(tn.f, tn.f + 0.6, t)); m4.compose(p3.set(tn.x, tn.y, tn.z), q.identity(), s3.set(tn.s * k, tn.s * k, tn.s * k)); tentMesh.setMatrixAt(i, m4); });
    tentMesh.instanceMatrix.needsUpdate = true;
    for (const an of animated) {
      const k = sstep(an.a, an.b, t) * (1 - sstep(an.va, an.vb, t)); an.obj.visible = k > 0.002;
      const Bs = an.base; if (an.mode === 'rise') an.obj.scale.set(Bs, Bs * Math.max(k, 0.001), Bs); else an.obj.scale.setScalar(Bs * Math.max(k, 0.001));
    }
    for (const tw of twMeshes) { const k = sstep(tw.a, tw.a + 1.0, t) * (1 - sstep(tw.b, tw.b + 1.0, t)); tw.m.visible = k > 0.002; tw.m.material.opacity = 0.95 * k; }
    for (const pf of puffs) {
      const on = sstep(pf.a, pf.a + 1.0, t) * (1 - sstep(pf.b - 1.0, pf.b, t)); const ph = ((t * 0.32 + pf.ph) % 1 + 1) % 1;
      pf.s.position.set(pf.x + ph * 0.3 * pf.scale + (pf.j - 0.5) * 0.04, pf.py + ph * 0.6 * pf.scale, pf.z - ph * 0.08);
      const sc = (0.08 + ph * 0.42) * pf.scale; pf.s.scale.set(sc, sc, sc);
      pf.s.material.opacity = on * 0.8 * Math.sin(Math.PI * Math.min(1, ph * 1.15)); pf.s.visible = on > 0.001;
    }
    const { target, d } = placeCamera(t);
    const sh = clamp(d * 0.75, 3, 40);
    Object.assign(sun.shadow.camera, { left: -sh, right: sh, top: sh, bottom: -sh, near: 0.5, far: d * 4 + 20 }); sun.shadow.camera.updateProjectionMatrix();
    if (GOLDEN) sun.position.set(target.x - d * 1.1, d * 0.38 + 0.6, target.z - d * 0.15); else
    sun.position.set(target.x - d * 0.55, d * 0.8 + 2, target.z + d * 0.45); sun.target.position.copy(target); sun.target.updateMatrixWorld();
    renderer.render(scene, camera);
  }
  window.renderAt = t => { update(t); return true; };
  window.stats = { buildings: B.length, trees: TR.length, pieces: pieces.length, tents: TENTS.length, landmarks: LMS.length, duration: DUR };
  update(0);
  window.ready = true;
}
