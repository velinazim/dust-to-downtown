name: Re-music scheduled videos
# Owner request 9.11.2026: replace the soundtrack of every scheduled (not yet public) video with the new soft piano
# from tools/music.py, without re-rendering. Details at the top of tools/remusic.py. Runs daily until nothing is
# left (YouTube's daily upload quota allows only a few uploads per day); a no-op once everything is swapped.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'     # just after YouTube's daily quota reset (midnight Pacific)
concurrency:
  group: youtube-upload
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  remusic:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -q numpy scipy requests
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          sudo mkdir -p /mnt/remusic && sudo chown "$USER" /mnt/remusic; df -h / /mnt | tail -2
      - name: Swap music
        env:
          GH_TOKEN: ${{ github.token }}
          REMUSIC_WORK: /mnt/remusic
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/remusic.py .
