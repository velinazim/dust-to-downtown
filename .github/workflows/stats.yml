name: Channel stats
# Daily read-only snapshot of subscribers / views -> analytics/<date>.json (shown on the owner's dashboard).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
concurrency:
  group: stats
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Snapshot
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/stats.py .
      - name: Commit
        run: |
          git config user.name "Dust to Downtown bot"; git config user.email "velinazim0776@gmail.com"
          git add analytics; git diff --cached --quiet && exit 0
          git commit -qm "stats: daily channel snapshot"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done
