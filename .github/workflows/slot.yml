name: Best publish time
# Picks the hour of day for new uploads from where the audience lives (tools/best_slot.py).
# Runs every Monday and on demand; only config/schedule.json and config/best_slot.md can change.
# Videos that are already scheduled keep their time.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
concurrency:
  group: best-slot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  slot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/best_slot.py
      - name: Commit
        run: |
          git config user.name "Dust to Downtown bot"; git config user.email "velinazim0776@gmail.com"
          git add config/schedule.json config/best_slot.md
          git diff --cached --quiet && exit 0
          git commit -qm "slot: best publish time"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done
