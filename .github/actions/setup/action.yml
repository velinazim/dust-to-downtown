name: Setup render environment
description: Node deps (three.js, fonts), Python deps, headless Chromium and ffmpeg
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: {node-version: '20', cache: 'npm'}
    - shell: bash
      run: npm ci --no-audit --no-fund
    - uses: actions/setup-python@v5
      with: {python-version: '3.12', cache: 'pip', cache-dependency-path: requirements.txt}
    - shell: bash
      run: pip install -q -r requirements.txt
    - shell: bash
      run: |
        python -m playwright install --with-deps chromium > /dev/null
        command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
        ffmpeg -version | head -1
